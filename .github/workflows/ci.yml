name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  c:
    name: C (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Build CLI, unit-test, and smoke-test
        working-directory: c
        run: |
          make cli
          make unit-test
          make test
      # The GUI is Windows-only; `make gui` is a no-op elsewhere.
      - name: Build GUI
        working-directory: c
        run: make gui

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Build
        working-directory: rust
        run: cargo build --release --locked
      - name: Test
        working-directory: rust
        run: cargo test --locked
      - name: Format check
        working-directory: rust
        run: cargo fmt --check
      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings
